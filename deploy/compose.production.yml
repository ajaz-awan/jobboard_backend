name: jobboard
services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:8}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set a strong MongoDB root password}
      MONGO_APP_USER: ${MONGO_APP_USER:-jobboard_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set a separate strong application password}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/01-jobboard.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    restart: unless-stopped
    volumes:
      - antivirus_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_APP_USER:-jobboard_app}:${MONGO_APP_PASSWORD}@mongo:27017/jobboard?authSource=jobboard
      CLAMAV_HOST: clamav
      MALWARE_SCAN: clamav
      RATE_LIMIT_STORE: mongo
    depends_on:
      mongo:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||5000)+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  mongo_data:
  antivirus_data:
  uploads:
